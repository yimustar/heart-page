<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>爱心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            animation: bgShift 8s ease-in-out infinite;
        }

        @keyframes bgShift {
            0%, 100% { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
            50% { background: linear-gradient(135deg, #2d1b69 0%, #1a1a2e 50%, #16213e 100%); }
        }

        .heart-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 10;
        }

        .heart {
            position: relative;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            transform: rotate(-45deg);
            animation: heartbeat 1.2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(233, 69, 96, 0.8), 0 0 120px rgba(233, 69, 96, 0.4);
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            border-radius: 50%;
        }

        .heart::before {
            top: -60px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 60px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
                box-shadow: 0 0 60px rgba(233, 69, 96, 0.8), 0 0 120px rgba(233, 69, 96, 0.4);
            }
            15% {
                transform: rotate(-45deg) scale(1.2);
                box-shadow: 0 0 80px rgba(233, 69, 96, 1), 0 0 160px rgba(233, 69, 96, 0.6);
            }
            30% {
                transform: rotate(-45deg) scale(1);
                box-shadow: 0 0 60px rgba(233, 69, 96, 0.8), 0 0 120px rgba(233, 69, 96, 0.4);
            }
            45% {
                transform: rotate(-45deg) scale(1.15);
                box-shadow: 0 0 70px rgba(233, 69, 96, 0.9), 0 0 140px rgba(233, 69, 96, 0.5);
            }
        }

        .text {
            color: #eee;
            font-size: 28px;
            letter-spacing: 10px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.8), 0 0 40px rgba(233, 69, 96, 0.4);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                opacity: 0.6;
                text-shadow: 0 0 20px rgba(233, 69, 96, 0.5), 0 0 40px rgba(233, 69, 96, 0.2);
            }
            to {
                opacity: 1;
                text-shadow: 0 0 30px rgba(233, 69, 96, 1), 0 0 60px rgba(233, 69, 96, 0.6), 0 0 90px rgba(233, 69, 96, 0.3);
            }
        }

        .floating-heart {
            position: absolute;
            color: #e94560;
            font-size: 20px;
            animation: floatUp 4s ease-in infinite;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            animation: sparkle 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sparkle {
            0%, 100% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .ring {
            position: absolute;
            border: 2px solid rgba(233, 69, 96, 0.3);
            border-radius: 50%;
            animation: ripple 3s ease-out infinite;
            pointer-events: none;
        }

        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }

        .shooting-heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #e94560;
            transform: rotate(-45deg);
            animation: shoot 3s ease-out infinite;
            opacity: 0;
            pointer-events: none;
        }

        .shooting-heart::before,
        .shooting-heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #e94560;
            border-radius: 50%;
        }

        .shooting-heart::before {
            top: -10px;
            left: 0;
        }

        .shooting-heart::after {
            top: 0;
            left: 10px;
        }

        @keyframes shoot {
            0% {
                transform: rotate(-45deg) scale(0);
                opacity: 1;
            }
            100% {
                transform: rotate(-45deg) scale(1) translate(200px, -200px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="heart-container">
        <div class="heart"></div>
        <div class="text">LOVE</div>
    </div>

    <script>
        // 生成漂浮的爱心
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }

        // 生成闪烁的星星
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.top = Math.random() * 100 + 'vh';
            sparkle.style.animationDuration = (Math.random() * 2 + 1) + 's';
            sparkle.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 4000);
        }

        // 生成涟漪
        function createRipple() {
            const container = document.querySelector('.heart-container');
            const ring = document.createElement('div');
            ring.className = 'ring';
            ring.style.left = '50%';
            ring.style.top = '50%';
            ring.style.transform = 'translate(-50%, -50%)';
            ring.style.animationDelay = Math.random() * 2 + 's';
            container.appendChild(ring);
            setTimeout(() => ring.remove(), 3000);
        }

        // 生成发射的爱心
        function createShootingHeart() {
            const heart = document.createElement('div');
            heart.className = 'shooting-heart';
            const angle = Math.random() * 360;
            const distance = 150 + Math.random() * 200;
            heart.style.left = '50%';
            heart.style.top = '40%';
            heart.style.setProperty('--tx', Math.cos(angle * Math.PI / 180) * distance + 'px');
            heart.style.setProperty('--ty', Math.sin(angle * Math.PI / 180) * distance + 'px');
            heart.style.animation = `shoot ${Math.random() * 2 + 2}s ease-out forwards`;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        // 定时生成动画元素
        setInterval(createFloatingHeart, 800);
        setInterval(createSparkle, 300);
        setInterval(createRipple, 1500);
        setInterval(createShootingHeart, 1000);

        // 点击效果
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'shooting-heart';
                    heart.style.left = e.clientX + 'px';
                    heart.style.top = e.clientY + 'px';
                    const angle = Math.random() * 360;
                    const distance = 100 + Math.random() * 150;
                    heart.style.animation = 'none';
                    heart.style.transform = `rotate(${angle}deg) scale(0)`;
                    heart.style.transition = 'all 1s ease-out';
                    document.body.appendChild(heart);
                    setTimeout(() => {
                        heart.style.transform = `rotate(${angle}deg) scale(1) translate(${Math.cos(angle * Math.PI / 180) * distance}px, ${Math.sin(angle * Math.PI / 180) * distance}px)`;
                        heart.style.opacity = '0';
                    }, 50);
                    setTimeout(() => heart.remove(), 1000);
                }, i * 100);
            }
        });

        // 初始化生成一些元素
        for (let i = 0; i < 10; i++) {
            setTimeout(createFloatingHeart, i * 200);
            setTimeout(createSparkle, i * 100);
        }
    </script>
</body>
</html>
