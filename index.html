<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>爱心变玫瑰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            z-index: 10;
        }

        .shape-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            cursor: pointer;
        }

        /* 爱心 */
        .heart {
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            transform: rotate(-45deg);
            top: 25px;
            left: 25px;
            animation: heartbeat 1.2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(233, 69, 96, 0.8);
            transition: all 2s ease-in-out;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            border-radius: 50%;
            transition: all 2s ease-in-out;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 50px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: rotate(-45deg) scale(1); }
            15% { transform: rotate(-45deg) scale(1.15); }
            30% { transform: rotate(-45deg) scale(1); }
            45% { transform: rotate(-45deg) scale(1.15); }
        }

        /* 玫瑰 */
        .rose {
            position: absolute;
            width: 120px;
            height: 120px;
            top: 15px;
            left: 15px;
            opacity: 0;
            transform: scale(0) rotate(-180deg);
            transition: all 2s ease-in-out;
            font-size: 100px;
            line-height: 120px;
            text-align: center;
            filter: drop-shadow(0 0 30px rgba(233, 69, 96, 0.8));
        }

        /* 变形状态 */
        .container.morphed .heart {
            opacity: 0;
            transform: rotate(-45deg) scale(0) rotate(360deg);
            box-shadow: 0 0 100px rgba(233, 69, 96, 1);
        }

        .container.morphed .rose {
            opacity: 1;
            transform: scale(1) rotate(0deg);
            animation: roseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes roseGlow {
            from { filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.5)); }
            to { filter: drop-shadow(0 0 50px rgba(233, 69, 96, 1)) drop-shadow(0 0 80px rgba(255, 107, 107, 0.6)); }
        }

        .text {
            color: #eee;
            font-size: 24px;
            letter-spacing: 8px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            transition: all 1s ease-in-out;
        }

        .container.morphed .text {
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
        }

        .hint {
            color: #888;
            font-size: 14px;
            margin-top: -20px;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* 花瓣飘落 */
        .petal {
            position: absolute;
            width: 15px;
            height: 15px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 50% 0 50% 50%;
            opacity: 0;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(1);
                opacity: 0;
            }
        }

        /* 光芒 */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(233, 69, 96, 0.3) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
        }

        .container.morphed .glow {
            opacity: 1;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
        }

        /* 星星 */
        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container" id="container">
        <div class="shape-wrapper" onclick="morph()">
            <div class="heart"></div>
            <div class="rose">🌹</div>
        </div>
        <div class="text" id="text">LOVE</div>
        <div class="hint" id="hint">点击爱心变玫瑰</div>
    </div>

    <script>
        let morphed = false;

        function morph() {
            if (morphed) return;
            morphed = true;

            const container = document.getElementById('container');
            const text = document.getElementById('text');
            const hint = document.getElementById('hint');

            container.classList.add('morphed');
            text.textContent = 'ROSE';
            hint.textContent = '玫瑰绽放';

            // 产生花瓣
            for (let i = 0; i < 30; i++) {
                setTimeout(() => createPetal(), i * 100);
            }

            // 产生星星
            for (let i = 0; i < 20; i++) {
                setTimeout(() => createStar(), i * 150);
            }
        }

        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = (Math.random() * 3 + 3) + 's';
            petal.style.animationDelay = Math.random() * 1 + 's';
            petal.style.transform = `rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 7000);
        }

        function createStar() {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 2 + 1) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 4000);
        }

        // 初始化星星
        for (let i = 0; i < 15; i++) {
            createStar();
        }

        // 5秒后自动变形
        setTimeout(() => {
            if (!morphed) morph();
        }, 5000);
    </script>
</body>
</html>
